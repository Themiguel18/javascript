<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font: normal 18pt arial;
        }
        input{
            font: normal 18pt arial;
            width: 100px;
        }
        #res{
            margin: 10px 0; 
        }
    </style>
</head>
<body>
    <h1>Multiplicando valores</h1>
    <input type="number" name="n1" id="n1"> x
    <input type="number" name="n2" id="n2"> 
    <input type="button" value="Multiplicar" onclick="mult()">
    <div id="res">resultado</div>
    <script>
        function mult(){
            var n1 = window.document.getElementById('n1')
            var n2 = window.document.getElementById('n2')
            var n1 = Number(n1.value)
            var n2 = Number(n2.value)
            var m = n1*n2
            var res = window.document.getElementById('res')
            res.innerHTML = ` ${n1} X ${n2} = ${m}`

        }
    </script>

</body>
</html>
