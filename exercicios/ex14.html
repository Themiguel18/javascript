<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contar com salto</h1>
    <p><input type="number" name="n1" id="n1" placeholder="Digite o inicio da contagem"> <input type="number" name="n2" id="n2" placeholder="Digite o fim da contagem"> <input type="number" name="salto" id="salto" placeholder="Digite o salto"> <button onclick="gerar()">Gerar</button></p>
    <div id="res">Aqui vai aparecer a contagem...</div>
    <script>
        function gerar(){
            let inicio = document.getElementById('n1')
            let fim = document.getElementById('n2')
            let s = document.getElementById('salto')
            let cont = document.getElementById('res')
            if(inicio.value.length == 0 || fim.value.length == 0 || s.value.length == 0){
                alert('Informe todos os valores seu palhaço')
            }else{
                let i = Number(inicio.value)
                let f = Number(fim.value)
                let sal = Number(s.value)
                for(let c = i; c <= f; c =+ sal){
                    cont.innerHTML += c = ''

                }
            }
        }
    </script>
</body>
</html>
