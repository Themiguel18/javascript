<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html{
            background-color: tan;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            justify-content: center;
        }

        h1{
            font-weight: 300;
        }
        h1 span{
            font-weight: 600;
            background-color: whitesmoke;
            padding: 0 10px;
        }

        button{
            background-color: transparent;
            border: 1px solid black;

        }

        button:hover{
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
    <h1>Verificador de <span>idade</span></h1>
    <p><input type="number" name="idade" id="idade" placeholder="Digite a sua idade"> <button onclick="check()">Check</button></p>
    <div id="res">Verificando...</div>
    <script>
        function check(){
            let i = document.getElementById('idade')
            let txt = document.getElementById('res')
            if(i.value.length == 0 || i.value < 0){
                alert('Digite a sua idade seu desgraçado')
            }else{
                let age = Number(i.value)
                if(age < 18){
                    txt.innerHTML = 'Menor de idade'
                }else{
                     txt.innerHTML = 'Maior de idade'
                }
            }
        }
    </script>
</body>
</html>
