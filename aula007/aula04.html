<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html{
            background-color: silver;
            color: rgb(155, 67, 155);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Sistema de nacionalidade</h1>
    <input type="text" name="txt" id="txt" placeholder="Nacionalidade">
    <input type="button" value="mandar" onclick="clicar()">
    <div id="div"></div>
    <script>
        function clicar(){
            var txt = window.document.getElementById('txt')
            var txt = String(txt.value)
            var div = window.document.getElementById('div')
            
            if(txt == 'angolana'){
                div.innerHTML = 'Voce e angolana'
            }else{
                div.innerHTML = 'Voce e estrangeiro'
            }
        }
    </script>
</body>
</html>
