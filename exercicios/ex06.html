<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html{
            background-color: wheat;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            justify-content: center;
        }
        div#res{
            border: 1px solid black;
            width: 200px;
            padding: 10px  5px;
        }
        h1{
            font-weight: 400;

        }
        h1 span{
            font-weight: 700;
            color: whitesmoke;
            background-color: rgb(148, 147, 147);
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <h1>Somador de <span>Números</span></h1>
    <p><input type="number" name="n1" id="n1" placeholder="Number"> + <input type="number" name="n2" id="n2" placeholder="Number"> <input type="button" value="somar" onclick="somar()"></p>
    <div id="res">Aqui vai aparecer o resultado</div>
    <script>
        function somar(){
            let txt1 = document.getElementById('n1')
            let txt2 = document.getElementById('n2')
            let txt = document.getElementById('res')
            if(txt1.value.length == 0 || txt2.value.length == 0){
                alert('Digite um numero seu estupido')
            }else{
                let txtn1 = Number(txt1.value)
                let txtn2 = Number(txt2.value)
                let soma = txtn1 + txtn2
                txt.innerHTML = `${txtn1} + ${txtn2} = ${soma}`
            }
        }
    </script>
</body>
</html>
