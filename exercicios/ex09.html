<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,html{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: steelblue;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            justify-content: center;

        }
        h1{
            font-weight: 400;
        }
        h1 span{
            font-weight: 600;
            background-color: teal;
            color: white;
            padding: 0 10px;
        }
        button{
            background-color: transparent;
            border: 1px solid black;
            padding: 2px 10px;
            transition: background-color .5s;
        }
        button:hover{
            color: white;
            background-color: black;
            
        }
    </style>
</head>
<body>
    <h1>Contar <span>caracteres</span></h1>
    <p><input type="text" name="txt" id="txt" placeholder="Digite os caracteres"> <button onclick="contar()">Contar</button></p>
    <div id="res">Aqui vai aparecer o número de carateres que digitou...</div>

    <script>
        function contar(){
            let c = document.getElementById('txt')
            let n = document.getElementById('res')
            if(c.value.length == 0){
                alert('Não digitou nada no input')
            }else{
                n.innerHTML = `Digitou ${c.value.length} caracteres `
            }
        }
    </script>
</body>
</html>
