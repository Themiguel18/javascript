<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font: bold 20px arial;
        }
    </style>
</head>
<body>
    
    <script>
        var nome = window.prompt('Qual e o seu nome')
        document.write(` Ola ` + nome + ` seu nome tem ${nome.length} letras `)
        document.write(` e em maiusculo é ${nome.toUpperCase(nome)} `)
        document.write(` e em minusculo é ${nome.toLowerCase(nome) } `)
    </script>
</body>
</html>
