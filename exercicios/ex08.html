<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html{
            background-color: silver;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            justify-content: center;
        }
        fieldset{
            display: flex;
            align-items: center;
            gap: 90px;
        }
        fieldset div.botao button{
            margin-bottom: 10px;
        }
        button{
            background-color: transparent;
            border: 1px solid black;
        }
        button:hover{
            color: white;
            background-color: black;
        }
        h1 span{
            background-color: darkslategray;
            color: white;
            padding: 0 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Verificador de <span>Transição escolar</span></h1>
    <fieldset>
        <legend>Notas</legend>
        <div>
            <p><input type="number" name="nota1" id="nota1" placeholder="Digite a primeira nota"></p>
            <p><input type="number" name="nota2" id="nota2" placeholder="Digite a segunda nota"></p>
            <p><input type="number" name="nota3" id="nota3" placeholder="Digite a terceira nota"></p>
        </div>
        <div class="botao"><button onclick="analisar()">Analisar</button>
        <div id="res">Esperando notas...</div></div>
    </fieldset>
    <script>
        function analisar(){
            let p1 = document.getElementById('nota1')
            let p2 = document.getElementById('nota2')
            let p3 = document.getElementById('nota3')
            let txt = document.getElementById('res')
            if(p1.value.length == 0 || p2.value.length == 0 || p3.value.length == 0){
                alert('Digite todas as notas seu palhaço')
            }else{
                let n1 = Number(p1.value)
                let n2 = Number(p2.value)
                let n3 = Number(p3.value)
                let media = (n1 + n2 + n3) / 3
                if(media < 10){
                    txt.innerHTML = `A média é ${media}, aluno não apto`
                }else{
                    txt.innerHTML = `A média é ${media}, aluno apto`
                }
            }
        }
    </script>
</body>
</html>
